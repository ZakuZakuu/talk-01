roke-width="0.05" /><rect x="35.6" y="25.6" width="1.5" height="1.5" rx="0.2" fill="#2b2a28" stroke="#2b2a28" stroke-width="0.05" /><circle cx="19" cy="17" r="1.2" fill="#e6e6e6" stroke="#2b2a28" stroke-width="0.12" /><circle cx="23" cy="17" r="1.2" fill="#e6e6e6" stroke="#2b2a28" stroke-width="0.12" /><text x="27" y="17.8" font-size="1.5" text-anchor="start" fill="#e8f1ea" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">BOOT  RST</text><text x="29" y="21.2" font-size="1.5" text-anchor="middle" fill="#e8f1ea" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">I/O PINS</text><rect x="46" y="8" width="3" height="26" rx="1.5" fill="#d9d2bd" stroke="#7a7667" stroke-width="0.3" /><rect x="14" y="38" width="30" height="50" rx="4" fill="#cfc8b4" stroke="#8a857a" stroke-width="0.35" /><path d="M17,41 L10,86 H48 L41,41" fill="none" stroke="#4a463e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="41" r="1.4" fill="#b79c4a" stroke="#4d3d12" stroke-width="0.2" /><circle cx="41" cy="41" r="1.4" fill="#b79c4a" stroke="#4d3d12" stroke-width="0.2" /></g><text x="840" y="150" font-size="16" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">SIDE · on a desk (the body leans 30°)</text><g transform="translate(1180,640) scale(3.0)"><line x1="-50.61" y1="0" x2="33.32" y2="0" stroke="#2b2a28" stroke-width="0.4" /><line x1="-50.61" y1="0" x2="-52.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-47.61" y1="0" x2="-49.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-44.61" y1="0" x2="-46.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-41.61" y1="0" x2="-43.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-38.61" y1="0" x2="-40.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-35.61" y1="0" x2="-37.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-32.61" y1="0" x2="-34.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-29.61" y1="0" x2="-31.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-26.61" y1="0" x2="-28.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-23.61" y1="0" x2="-25.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-20.61" y1="0" x2="-22.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-17.61" y1="0" x2="-19.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-14.61" y1="0" x2="-16.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-11.61" y1="0" x2="-13.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-8.61" y1="0" x2="-10.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-5.61" y1="0" x2="-7.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="-2.61" y1="0" x2="-4.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="0.39" y1="0" x2="-1.61" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="3.39" y1="0" x2="1.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="6.39" y1="0" x2="4.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="9.39" y1="0" x2="7.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="12.39" y1="0" x2="10.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="15.39" y1="0" x2="13.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="18.39" y1="0" x2="16.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="21.39" y1="0" x2="19.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="24.39" y1="0" x2="22.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="27.39" y1="0" x2="25.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><line x1="30.39" y1="0" x2="28.39" y2="2.2" stroke="#7a756b" stroke-width="0.12" /><g transform="rotate(-30)"><rect x="0" y="-92" width="20" height="92" rx="5" fill="#e8e1cf" stroke="#2b2a28" stroke-width="0.45" /><rect x="0" y="-84" width="1.6" height="26" rx="0.6" fill="#d9d2bd" stroke="#7a7667" stroke-width="0.2" /><rect x="4" y="-60" width="9" height="34" rx="4" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.3" /></g><g transform="translate(-26,-45.03) rotate(110.25)"><rect x="0" y="-1.3" width="48" height="2.6" rx="1.18" fill="#4a463e" stroke="#2b2a28" stroke-width="0.25" /></g><circle cx="-26" cy="-45.03" r="0.9" fill="#2b2a28" stroke="#2b2a28" stroke-width="0.05" /><rect x="-44.21" y="-0.9" width="3.2" height="1.8" rx="0.7" fill="#3a3836" stroke="#2b2a28" stroke-width="0.15" /></g><text x="60" y="700" font-size="12.5" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">The hatch (above)</text><text x="60" y="719" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">a small plate over the top of the board: two quarter-turn feet (the OP-Z idea), a thumb notch.</text><text x="60" y="738" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Behind it: BOOT and RESET buttons, a row of I/O pins for the user's own programs, and a place for the label.</text><text x="60" y="757" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Why above: the dev board sits at the top (its USB-C is on the top edge), so the pins are right there.</text><text x="60" y="776" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start"></text><text x="60" y="795" font-size="12.5" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">The U stand (below)</text><text x="60" y="814" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">a small U about 30 mm wide, hinged mid-height; it nests in a groove and folds out to prop the body at about 30°.</text><text x="60" y="833" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">It is short, not a full-back panel; a printed U in PETG with a metal hinge pin; two small rubber feet on its ends.</text><text x="60" y="852" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Variant (round 3, Cut): the hatch IS the stand. It swings out as the kickstand and opens the bay in one action,</text><text x="60" y="871" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">but leaves the bay exposed while it stands; I prefer the separate U for that reason.</text><text x="60" y="890" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start"></text><text x="60" y="909" font-size="12.5" fill="#9a2f1a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Open questions</text><text x="60" y="928" font-size="12.5" fill="#9a2f1a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">1. How much of the bay should be reachable without opening? (BOOT/RESET is the one often needed.)</text><text x="60" y="947" font-size="12.5" fill="#9a2f1a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">2. Which pins to expose: just the free GPIO and 3V3/GND? (Not decided; the chosen board decides.)</text><text x="60" y="966" font-size="12.5" fill="#9a2f1a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">3. A rubber or silicone foot on the stand, so desk and keyboard vibration do not reach the mic.</text></svg>