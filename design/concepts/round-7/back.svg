<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1030" width="1920" height="1030"><defs><linearGradient id="bk1" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#e9e2d1"/><stop offset="0.55" stop-color="#e8e1cf"/><stop offset="1" stop-color="#dad3c2"/></linearGradient><linearGradient id="bk2" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#e9e2d1"/><stop offset="0.55" stop-color="#e8e1cf"/><stop offset="1" stop-color="#dad3c2"/></linearGradient></defs><rect width="1920" height="1030" fill="#f4f1ea"/><text x="60" y="62" font-size="30" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">talk.01 · THE BACK · a small U stand and a hatch with pins</text><text x="60" y="92" font-size="15" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">shared by every body in rounds 6 and 7 · the back is NOT one big cover: a small hatch above, a small U stand below</text><text x="1860" y="52" font-size="13" fill="#e8541e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">TENTATIVE · NOT A FINAL DESIGN</text><text x="1860" y="72" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">a sketch of an idea, not engineered; nothing built or measured</text><text x="60" y="150" font-size="16" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">REAR · closed</text><g transform="translate(60,180) scale(5.0)"><rect x="0" y="0" width="58" height="92" rx="5" fill="url(#bk1)" stroke="#2b2a28" stroke-width="0.5" /><rect x="13" y="8" width="32" height="26" rx="4" fill="#d9d2bd" stroke="#7a7667" stroke-width="0.45" /><circle cx="18" cy="29.5" r="2.3" fill="#e8541e" stroke="#2b2a28" stroke-width="0.25" /><line x1="16.4" y1="29.5" x2="19.6" y2="29.5" stroke="#2b2a28" stroke-width="0.3" /><circle cx="40" cy="29.5" r="2.3" fill="#e8541e" stroke="#2b2a28" stroke-width="0.25" /><line x1="38.4" y1="29.5" x2="41.6" y2="29.5" stroke="#2b2a28" stroke-width="0.3" /><rect x="23" y="8.8" width="12" height="2.6" rx="1.3" fill="#b8b19c" stroke="none" stroke-width="0" /><text x="29" y="20.5" font-size="2.2" text-anchor="middle" fill="#6f6a5e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">HATCH</text><text x="29" y="24.2" font-size="1.5" text-anchor="middle" fill="#6f6a5e" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">quarter-turn feet</text><rect x="14" y="38" width="30" height="50" rx="4" fill="#cfc8b4" stroke="#8a857a" stroke-width="0.35" /><path d="M17,41 V82 H41 V41" fill="none" stroke="#4a463e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="41" r="1.4" fill="#b79c4a" stroke="#4d3d12" stroke-width="0.2" /><circle cx="41" cy="41" r="1.4" fill="#b79c4a" stroke="#4d3d12" stroke-width="0.2" /><circle cx="29" cy="90" r="3.2" fill="#e8e1cf" stroke="#2b2a28" stroke-width="0.25" /><text x="29" y="61" font-size="2.2" text-anchor="middle" fill="#6f6a5e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">U STAND</text><text x="29" y="64.6" font-size="1.5" text-anchor="middle" fill="#6f6a5e" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">folds into the groove</text><rect x="7" y="89.4" width="10" height="1.4" rx="0.6" fill="#2b2a28" stroke="#2b2a28" stroke-width="0.05" /><rect x="41" y="89.4" width="10" height="1.4" rx="0.6" fill="#2b2a28" stroke="#2b2a28" stroke-width="0.05" /></g><text x="450" y="150" font-size="16" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">REAR · hatch open, stand out</text><g transform="translate(450,180) scale(5.0)"><rect x="0" y="0" width="58" height="92" rx="5" fill="url(#bk2)