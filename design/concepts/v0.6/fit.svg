<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000"><defs></defs><rect width="1920" height="1000" fill="#f4f1ea"/><text x="60" y="62" font-size="28" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">talk.01 · v0.6 · A FIRST FIT CHECK WITH REAL PART SIZES (on paper)</text><text x="60" y="92" font-size="15" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the parts at their sizes inside the 58 × 92 × 22 mm body: what fits, what is tight, what the bigger wheel moves</text><text x="1860" y="52" font-size="13" fill="#e8541e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">TENTATIVE · NOTHING BOUGHT OR MEASURED</text><text x="1860" y="72" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">x-ray front 10 mm = 60 px · side 10 mm = 60 px</text><text x="90" y="150" font-size="15" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">THE FACE, SEEN THROUGH</text><g transform="translate(130,200) scale(6.0)"><path d="M5,0 H43 L57,14 Q58,15 58,16.5 V87 Q58,92 53,92 H5 Q0,92 0,87 V5 Q0,0 5,0 Z" fill="#f6f2e6" stroke="#3d382d" stroke-width="0.4"/><rect x="20.25" y="1" width="17.5" height="21" rx="1" fill="#2f6b52" stroke="#173d2e" stroke-width="0.25" /><rect x="25.2" y="-0.8" width="7.6" height="3" rx="0.6" fill="#cfcfcf" stroke="#2b2a28" stroke-width="0.2" /><circle cx="43.3" cy="12" r="11.3" fill="none" stroke="#8a857a" stroke-width="0.3" /><circle cx="43.3" cy="12" r="9.5" fill="#3e3b35" stroke="#000" stroke-width="0.3" /><rect fill-opacity="0.8" x="36" y="12.5" width="14" height="11" rx="1" fill="#444" stroke="#222" stroke-width="0.25" /><rect x="38.2" y="14.2" width="4.5" height="4.5" rx="0.6" fill="#111" stroke="#000" stroke-width="0.2" /><rect x="38.2" y="19" width="4.5" height="4.5" rx="0.6" fill="#111" stroke="#000" stroke-width="0.2" /><rect x="8" y="40" width="16.7" height="12.7" rx="1" fill="#2f6b52" stroke="#173d2e" stroke-width="0.25" /><circle cx="16.35" cy="46.35" r="2" fill="#111" stroke="none" stroke-width="0" /><circle cx="29" cy="64" r="19" fill="none" stroke="#0c0b0a" stroke-width="0.4" /><rect x="7" y="33" width="44" height="2" rx="0" fill="none" stroke="#8a857a" stroke-width="0.2" /><rect stroke-dasharray="1 0.8" x="7.5" y="56" width="43" height="28" rx="1" fill="none" stroke="#8a857a" stroke-width="0.3" /><rect x="2.4" y="25" width="4" height="4" rx="0.5" fill="#111" stroke="#000" stroke-width="0.2" /><rect x="2.4" y="42" width="4" height="4" rx="0.5" fill="#111" stroke="#000" stroke-width="0.2" /><polygon points="0,12 -5,16.5 -3.2,56 0,58" fill="#ee6a2c" stroke="#8a2f0e" stroke-width="0.4" stroke-linejoin="round"/></g><line x1="304" y1="272" x2="510" y2="248" stroke="#8a857a" stroke-width="0.8" /><circle cx="304" cy="272" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="516" y="252" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">board 21 × 17.5 mm, USB-C on top</text><line x1="388" y1="272" x2="510" y2="308" stroke="#8a857a" stroke-width="0.8" /><circle cx="388" cy="272" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="516" y="312" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">wheel 19 mm; the board sits BEHIND it</text><line x1="394" y1="302" x2="510" y2="368" stroke="#8a857a" stroke-width="0.8" /><circle cx="394" cy="302" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="516" y="372" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">small PCB + two switches (about 4.5 mm)</text><line x1="226" y1="476" x2="510" y2="476" stroke="#8a857a" stroke-width="0.8" /><circle cx="226" cy="476" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="516" y="480" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">mic breakout, 16.7 × 12.7 mm</text><line x1="304" y1="584" x2="510" y2="596" stroke="#8a857a" stroke-width="0.8" /><circle cx="304" cy="584" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="516" y="600" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">round hole, 38 mm</text><line x1="304" y1="620" x2="510" y2="656" stroke="#8a857a" stroke-width="0.8" /><circle cx="304" cy="620" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="516" y="660" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">battery room 43 × 28 mm</text><line x1="156.4" y1="362" x2="510" y2="416" stroke="#8a857a" stroke-width="0.8" /><circle cx="156.4" cy="362" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="516" y="420" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">key switches S1, S2 (under the key)</text><text x="760" y="150" font-size="15" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">SIDE SECTION (front at the left)</text><g transform="translate(780,190) scale(6.0)"><rect x="0" y="0" width="22" height="92" rx="3" fill="#f6f2e6" stroke="#3d382d" stroke-width="0.4" /><rect x="0" y="0" width="1.8" height="36" rx="0.3" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="0" y="36" width="2.4" height="56" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.25" /><rect x="3" y="36" width="1.6" height="56" rx="0.3" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="2.9" y="45" width="1.8" height="38" rx="0" fill="#15130f" stroke="none" stroke-width="0" /><rect x="20.4" y="0" width="1.6" height="92" rx="0.3" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="0.6" y="2.5" width="5.4" height="19" rx="0.9" fill="#3e3b35" stroke="#000" stroke-width="0.3" /><rect x="6" y="6.5" width="1.4" height="11" rx="0.4" fill="#8a857a" stroke="#444" stroke-width="0.2" /><rect x="7.6" y="7" width="4.4" height="10" rx="0.5" fill="#111" stroke="#000" stroke-width="0.2" /><rect x="12" y="4.5" width="1.2" height="15" rx="0.3" fill="#2f6b52" stroke="#173d2e" stroke-width="0.2" /><rect x="13.8" y="1" width="5" height="21" rx="0.4" fill="#2f6b52" stroke="#173d2e" stroke-width="0.25" /><rect x="14.6" y="-0.6" width="3.2" height="2.8" rx="0.5" fill="#cfcfcf" stroke="#2b2a28" stroke-width="0.2" /><rect x="4.7" y="40" width="1.4" height="12.7" rx="0.3" fill="#2f6b52" stroke="#173d2e" stroke-width="0.25" /><rect x="6.1" y="45.4" width="0.9" height="2" rx="0.2" fill="#222" stroke="#000" stroke-width="0.15" /><rect stroke-dasharray="1 0.8" x="7.4" y="56" width="11.6" height="28" rx="0.8" fill="none" stroke="#8a857a" stroke-width="0.3" /><rect x="20.4" y="12" width="1.6" height="20" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.25" /><rect x="17.2" y="15" width="3.2" height="14" rx="0.3" fill="#222" stroke="#000" stroke-width="0.2" /></g><line x1="800.4" y1="238" x2="932" y2="202" stroke="#8a857a" stroke-width="0.8" /><circle cx="800.4" cy="238" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="938" y="206" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">wheel, 5.4 mm</text><line x1="820.2" y1="250" x2="932" y2="244" stroke="#8a857a" stroke-width="0.8" /><circle cx="820.2" cy="250" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="938" y="248" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">cam on the back, 1.4 mm</text><line x1="838.8" y1="262" x2="932" y2="286" stroke="#8a857a" stroke-width="0.8" /><circle cx="838.8" cy="262" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="938" y="290" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">two switches, about 4.3 mm</text><line x1="877.8" y1="274" x2="932" y2="334" stroke="#8a857a" stroke-width="0.8" /><circle cx="877.8" cy="274" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="938" y="338" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">board + parts: about 5 mm (not verified)</text><line x1="877.2" y1="194.8" x2="932" y2="172" stroke="#8a857a" stroke-width="0.8" /><circle cx="877.2" cy="194.8" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="938" y="176" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">USB-C near the back</text><line x1="812.4" y1="466" x2="932" y2="442" stroke="#8a857a" stroke-width="0.8" /><circle cx="812.4" cy="466" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="938" y="446" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">mic board on the front wall</text><line x1="787.2" y1="550" x2="932" y2="538" stroke="#8a857a" stroke-width="0.8" /><circle cx="787.2" cy="550" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="938" y="542" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">lid 2.4 mm</text><line x1="856.8" y1="574" x2="932" y2="622" stroke="#8a857a" stroke-width="0.8" /><circle cx="856.8" cy="574" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="938" y="626" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">battery room: about 11 mm deep</text><text x="1260" y="150" font-size="15" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">HOW TWO SWITCHES READ FOUR POSITIONS (the back of the wheel)</text><g transform="translate(1380,330) scale(11)"><circle cx="0" cy="0" r="9.5" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.3" /><polygon points="2.07,4.99 1.4,5.22 0.7,5.35 0,5.4 -0.7,5.35 -1.4,5.22 -2.07,4.99 -2.7,4.68 -3.29,4.28 -3.82,3.82 -4.28,3.29 -4.68,2.7 -4.99,2.07 -3.14,1.3 -2.94,1.7 -2.7,2.07 -2.4,2.4 -2.07,2.7 -1.7,2.94 -1.3,3.14 -0.88,3.28 -0.44,3.37 0,3.4 0.44,3.37 0.88,3.28 1.3,3.14" fill="#ee6a2c" stroke="#333" stroke-width="0.2" /><polygon points="-2.07,4.99 -2.7,4.68 -3.29,4.28 -3.82,3.82 -4.28,3.29 -4.68,2.7 -4.99,2.07 -5.22,1.4 -5.35,0.7 -5.4,0 -5.35,-0.7 -5.22,-1.4 -4.99,-2.07 -3.14,-1.3 -3.28,-0.88 -3.37,-0.44 -3.4,0 -3.37,0.44 -3.28,0.88 -3.14,1.3 -2.94,1.7 -2.7,2.07 -2.4,2.4 -2.07,2.7 -1.7,2.94 -1.3,3.14" fill="#c9a24b" stroke="#333" stroke-width="0.2" /><circle cx="5.37" cy="5.37" r="0.4" fill="#3d382d" stroke="none" stroke-width="0" /><circle cx="0" cy="7.6" r="0.4" fill="#3d382d" stroke="none" stroke-width="0" /><circle cx="-5.37" cy="5.37" r="0.4" fill="#3d382d" stroke="none" stroke-width="0" /><circle cx="-7.6" cy="0" r="0.4" fill="#3d382d" stroke="none" stroke-width="0" /><rect x="-3.72" y="2.4" width="2.4" height="2.4" rx="0.4" fill="#111" stroke="#000" stroke-width="0.15" /><rect x="-5.33" y="0.3" width="2.4" height="2.4" rx="0.4" fill="#111" stroke="#000" stroke-width="0.15" /></g><text x="1560" y="215" font-size="12" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">position</text><text x="1690" y="215" font-size="12" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">A</text><text x="1740" y="215" font-size="12" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">B</text><text x="1560" y="237" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">0 DICT</text><text x="1690" y="237" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">0</text><text x="1740" y="237" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">0</text><text x="1560" y="259" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">1 TALK</text><text x="1690" y="259" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">1</text><text x="1740" y="259" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">0</text><text x="1560" y="281" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">2 OPEN</text><text x="1690" y="281" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">1</text><text x="1740" y="281" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">1</text><text x="1560" y="303" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">3 LOCK</text><text x="1690" y="303" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">0</text><text x="1740" y="303" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">1</text><text x="1560" y="330" font-size="11" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the lobes press the switches; only one</text><text x="1560" y="345" font-size="11" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">switch changes at each step (Gray code),</text><text x="1560" y="360" font-size="11" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">so a half-made click never reads as a</text><text x="1560" y="375" font-size="11" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">wrong mode. The switches sit inboard,</text><text x="1560" y="390" font-size="11" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">toward the body centre, as the owner asked.</text><text x="1560" y="408" font-size="11" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">(schematic: lobe angles are set once the</text><text x="1560" y="423" font-size="11" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">switch spacing is known.)</text><text x="60" y="810" font-size="11.5" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">What the fit check finds (on paper):</text><text x="60" y="827" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· Depth: the wheel (5.4) + cam (1.4) + switches (4.3) + their PCB (1.2) end near 13.2 mm from the front; the board sits behind that at 13.8 to 18.8, and the back wall starts</text><text x="60" y="842" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  at 20.4: about 1.6 mm to spare. TIGHT.</text><text x="60" y="859" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· The board lies BEHIND the wheel stack (they overlap in plan, not in depth). The cable's USB-C is therefore near the back of the top edge, not centred in the thickness:</text><text x="60" y="874" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  acceptable, but decide it.</text><text x="60" y="891" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· The mic breakout sits against the front wall behind the hole; its port must line up with the hole. Port side varies between modules: check before designing the carrier.</text><text x="60" y="908" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· Battery room is kept: about 43 × 28 × 11 mm, enough for a small LiPo pack (not v0.1).</text><text x="60" y="925" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· Unverified: the board's thickness with its USB-C, whether it has castellated pads, and the exact module sizes. Measure on arrival; the CAD waits for that.</text></svg>