<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><defs></defs><rect width="1920" height="1080" fill="#f4f1ea"/><text x="60" y="62" font-size="30" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">talk.01 · WHICH WAY DOES THE THUMB WHEEL TURN?</text><text x="60" y="92" font-size="15" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">three ways to put a wheel under the left thumb · the second is the owner's reference (the roller in a pocket)</text><text x="1860" y="52" font-size="13" fill="#e8541e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">TENTATIVE · NOT A FINAL DESIGN</text><text x="80" y="160" font-size="20" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">A · TOP KNOB</text><text x="80" y="182" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">like the yellow walkie in the reference photo</text><g transform="translate(150,270) scale(5.2)"><rect x="0" y="0" width="50" height="80" rx="5" fill="#e8e1cf" stroke="#2b2a28" stroke-width="0.45" /><rect x="50" y="4" width="9" height="70" rx="3" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.4" /><rect x="8" y="6" width="32" height="20" rx="3" fill="#cfc8b4" stroke="#8a857a" stroke-width="0.3" /><text x="24" y="17" font-size="2.2" text-anchor="middle" fill="#8a857a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">mic</text><rect x="7" y="-8" width="13" height="9" rx="2" fill="#2b2a28" stroke="#000" stroke-width="0.4" /><line x1="8" y1="-7.4" x2="8" y2="0.4" stroke="#8a857a" stroke-width="0.3" /><line x1="9.6" y1="-7.4" x2="9.6" y2="0.4" stroke="#8a857a" stroke-width="0.3" /><line x1="11.2" y1="-7.4" x2="11.2" y2="0.4" stroke="#8a857a" stroke-width="0.3" /><line x1="12.8" y1="-7.4" x2="12.8" y2="0.4" stroke="#8a857a" stroke-width="0.3" /><line x1="14.4" y1="-7.4" x2="14.4" y2="0.4" stroke="#8a857a" stroke-width="0.3" /><line x1="16" y1="-7.4" x2="16" y2="0.4" stroke="#8a857a" stroke-width="0.3" /><line x1="17.6" y1="-7.4" x2="17.6" y2="0.4" stroke="#8a857a" stroke-width="0.3" /><line x1="13.5" y1="-14" x2="13.5" y2="6" stroke="#c9461e" stroke-width="0.45" stroke-dasharray="1.2 0.8"/><path d="M5.13,-5.48 A8.5,8.5 0 0 1 21.87,-5.48" fill="none" stroke="#c9461e" stroke-width="0.9" stroke-linecap="round"/><polygon points="21.87,-5.48 20.31,-7.43 22.67,-7.85" fill="#c9461e" stroke="#c9461e" stroke-width="0.05" /><text x="24" y="-2" font-size="2" text-anchor="start" fill="#c9461e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">axis: up</text></g><text x="80" y="760" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the thumb TWISTS it; the axis points up. Natural for a radio,</text><text x="80" y="777" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">but the top is where the USB-C and the cable go; twisting</text><text x="80" y="794" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">while holding is awkward.</text><text x="680" y="160" font-size="20" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">B · EDGE ROLLER</text><text x="680" y="182" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">like the corner roller in the dark gadget</text><g transform="translate(750,270) scale(5.2)"><rect x="0" y="0" width="50" height="80" rx="5" fill="#e8e1cf" stroke="#2b2a28" stroke-width="0.45" /><rect x="50" y="4" width="9" height="70" rx="3" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.4" /><rect x="8" y="6" width="32" height="20" rx="3" fill="#cfc8b4" stroke="#8a857a" stroke-width="0.3" /><text x="24" y="17" font-size="2.2" text-anchor="middle" fill="#8a857a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">mic</text><rect x="-1" y="25.8" width="11.6" height="28.4" rx="4" fill="#1d1b19" stroke="#000" stroke-width="0.4" /><rect x="-3.2" y="28" width="8.6" height="24" rx="3.2" fill="#2b2927" stroke="#000" stroke-width="0.4" /><line x1="-2.8" y1="30" x2="4.8" y2="30" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="31.18" x2="4.8" y2="31.18" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="32.35" x2="4.8" y2="32.35" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="33.53" x2="4.8" y2="33.53" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="34.71" x2="4.8" y2="34.71" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="35.88" x2="4.8" y2="35.88" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="37.06" x2="4.8" y2="37.06" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="38.24" x2="4.8" y2="38.24" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="39.41" x2="4.8" y2="39.41" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="40.59" x2="4.8" y2="40.59" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="41.76" x2="4.8" y2="41.76" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="42.94" x2="4.8" y2="42.94" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="44.12" x2="4.8" y2="44.12" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="45.29" x2="4.8" y2="45.29" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="46.47" x2="4.8" y2="46.47" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="47.65" x2="4.8" y2="47.65" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="48.82" x2="4.8" y2="48.82" stroke="#7a756c" stroke-width="0.28" /><line x1="-2.8" y1="50" x2="4.8" y2="50" stroke="#7a756c" stroke-width="0.28" /><rect opacity="0.18" x="-2.6" y="29.2" width="1.4" height="21.6" rx="0.7" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="-10" y1="28" x2="-10" y2="52" stroke="#c9461e" stroke-width="0.9" stroke-linecap="round"/><polygon points="-10,26 -11.6,29 -8.4,29" fill="#c9461e" stroke="#c9461e" stroke-width="0.05" /><polygon points="-10,54 -11.6,51 -8.4,51" fill="#c9461e" stroke="#c9461e" stroke-width="0.05" /><circle cx="1.2" cy="40" r="1.4" fill="none" stroke="#c9461e" stroke-width="0.45" /><circle cx="1.2" cy="40" r="0.35" fill="#c9461e" stroke="none" stroke-width="0" /><text x="-8" y="60" font-size="2" text-anchor="start" fill="#c9461e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">axis: toward you</text></g><text x="680" y="760" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the thumb STROKES it up and down along the edge; the axis</text><text x="680" y="777" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">points toward you. Sunk in a pocket so it is protected. My</text><text x="680" y="794" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">reading of what you want.</text><text x="1280" y="160" font-size="20" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">C · FACE DIAL</text><text x="1280" y="182" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">like the dials in rounds 2 to 5</text><g transform="translate(1350,270) scale(5.2)"><rect x="0" y="0" width="50" height="80" rx="5" fill="#e8e1cf" stroke="#2b2a28" stroke-width="0.45" /><rect x="50" y="4" width="9" height="70" rx="3" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.4" /><rect x="8" y="6" width="32" height="20" rx="3" fill="#cfc8b4" stroke="#8a857a" stroke-width="0.3" /><text x="24" y="17" font-size="2.2" text-anchor="middle" fill="#8a857a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">mic</text><circle cx="24" cy="52" r="9.5" fill="#2b2a28" stroke="#000" stroke-width="0.4" /><circle cx="24" cy="52" r="6.5" fill="#4a463e" stroke="none" stroke-width="0" /><line x1="24" y1="52" x2="24" y2="46.4" stroke="#e8672a" stroke-width="1" stroke-linecap="round"/><path d="M14.42,43.97 A12.5,12.5 0 0 1 34.83,45.75" fill="none" stroke="#c9461e" stroke-width="0.9" stroke-linecap="round"/><polygon points="34.83,45.75 32.69,44.44 34.76,43.24" fill="#c9461e" stroke="#c9461e" stroke-width="0.05" /><circle cx="24" cy="52" r="1.2" fill="none" stroke="#c9461e" stroke-width="0.4" /><text x="24" y="70" font-size="2" text-anchor="middle" fill="#c9461e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">axis: toward you</text></g><text x="1280" y="760" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the thumb turns it on the face; the axis points toward you. It</text><text x="1280" y="777" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">uses face area that the grille and window need.</text><text x="80" y="860" font-size="12.5" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">How the roller would work</text><text x="80" y="879" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">a ribbed cylinder, about 14 mm across and 24 mm long, on a pin; a spring-ball click gives the four detents (DICT, TALK, OPEN, LOCK); a small switch under it could make it clickable (click = latch).</text><text x="80" y="898" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">It sits in a pocket on the left edge and sticks out 2 to 3 mm; the pocket's walls protect it in a bag. Four small dots beside it show the mode.</text><text x="80" y="917" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">The wheel's position is read by a tiny rotary encoder or four contacts. The roller tends to get dust and wear in a matte print; a metal pin is advised.</text><text x="80" y="936" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start"></text><text x="80" y="955" font-size="12.5" fill="#9a2f1a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">What I assumed: you meant B. Tell me if you meant A or C.</text></svg>