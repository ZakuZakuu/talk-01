<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1050" width="1920" height="1050"><defs></defs><rect width="1920" height="1050" fill="#f4f1ea"/><text x="60" y="62" font-size="28" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">talk.01 · v0.2 study · WHERE DOES THE HAND REACH?</text><text x="60" y="92" font-size="15" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">a reasoning sketch, not a measurement: zones are drawn from how a hand holds a small slab. A printed mock-up is the real test.</text><text x="1860" y="52" font-size="13" fill="#e8541e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">TENTATIVE · NOT MEASURED</text><text x="110" y="150" font-size="17" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">LEFT hand holds it (the owner's way)</text><g transform="translate(160,190) scale(5.6)"><path d="M5,0 H46 L57,11 Q58,12 58,13.5 V87 Q58,92 53,92 H5 Q0,92 0,87 V5 Q0,0 5,0 Z" fill="#e8e1cf" stroke="#1f3d40" stroke-width="0.5"/><polygon points="0,12 -5,16.5 -3.2,56 0,58" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.5" stroke-linejoin="round"/><ellipse cx="8" cy="33" rx="11" ry="21" fill="#3f8fd2" fill-opacity="0.28" stroke="none" stroke-width="0.3" transform="rotate(0 8 33)"/><ellipse cx="5" cy="74" rx="12" ry="15" fill="#d8483c" fill-opacity="0.34" stroke="none" stroke-width="0.3" transform="rotate(-12 5 74)"/><ellipse cx="54" cy="30" rx="5.2" ry="6" fill="#8a857a" fill-opacity="0.4" stroke="none" stroke-width="0.3" transform="rotate(0 54 30)"/><ellipse cx="54" cy="44" rx="5.2" ry="6" fill="#8a857a" fill-opacity="0.4" stroke="none" stroke-width="0.3" transform="rotate(0 54 44)"/><ellipse cx="54" cy="58" rx="5.2" ry="6" fill="#8a857a" fill-opacity="0.4" stroke="none" stroke-width="0.3" transform="rotate(0 54 58)"/><ellipse cx="54" cy="72" rx="5.2" ry="6" fill="#8a857a" fill-opacity="0.4" stroke="none" stroke-width="0.3" transform="rotate(0 54 72)"/><ellipse cx="47" cy="9" rx="8.5" ry="6" fill="#3f9a52" fill-opacity="0.34" stroke="none" stroke-width="0.3" transform="rotate(-30 47 9)"/><circle cx="47.5" cy="10.5" r="2.4" fill="#2b7a3d" stroke="#fff" stroke-width="0.4" /><text x="47.5" y="11.3" font-size="2.4" text-anchor="middle" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">A</text><circle cx="54" cy="40" r="2.4" fill="#9a7a1e" stroke="#fff" stroke-width="0.4" /><text x="54" y="40.8" font-size="2.4" text-anchor="middle" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">B</text><circle cx="54" cy="74" r="2.4" fill="#9a2f1a" stroke="#fff" stroke-width="0.4" /><text x="54" y="74.8" font-size="2.4" text-anchor="middle" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">C</text><circle cx="6" cy="72" r="2.4" fill="#9a2f1a" stroke="#fff" stroke-width="0.4" /><text x="6" y="72.8" font-size="2.4" text-anchor="middle" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">D</text></g><text x="750" y="150" font-size="17" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">RIGHT hand holds it</text><g transform="translate(810,190) scale(5.6)"><path d="M5,0 H46 L57,11 Q58,12 58,13.5 V87 Q58,92 53,92 H5 Q0,92 0,87 V5 Q0,0 5,0 Z" fill="#e8e1cf" stroke="#1f3d40" stroke-width="0.5"/><polygon points="0,12 -5,16.5 -3.2,56 0,58" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.5" stroke-linejoin="round"/><ellipse cx="4" cy="22" rx="5.2" ry="5.5" fill="#3f8fd2" fill-opacity="0.34" stroke="none" stroke-width="0.3" transform="rotate(0 4 22)"/><ellipse cx="4" cy="33" rx="5.2" ry="5.5" fill="#3f8fd2" fill-opacity="0.34" stroke="none" stroke-width="0.3" transform="rotate(0 4 33)"/><ellipse cx="4" cy="44" rx="5.2" ry="5.5" fill="#3f8fd2" fill-opacity="0.34" stroke="none" stroke-width="0.3" transform="rotate(0 4 44)"/><ellipse cx="4" cy="55" rx="5.2" ry="5.5" fill="#3f8fd2" fill-opacity="0.34" stroke="none" stroke-width="0.3" transform="rotate(0 4 55)"/><ellipse cx="49" cy="22" rx="8" ry="17" fill="#3f9a52" fill-opacity="0.3" stroke="none" stroke-width="0.3" transform="rotate(14 49 22)"/><ellipse cx="52" cy="72" rx="9" ry="15" fill="#d8483c" fill-opacity="0.34" stroke="none" stroke-width="0.3" transform="rotate(10 52 72)"/><circle cx="47.5" cy="10.5" r="2.4" fill="#2b7a3d" stroke="#fff" stroke-width="0.4" /><text x="47.5" y="11.3" font-size="2.4" text-anchor="middle" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">A</text></g><rect x="110" y="730" width="16" height="14" rx="3" fill="#3f8fd2" fill-opacity="0.45" stroke="#3f8fd2"/><text x="136" y="742" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">thumb pad (left hand) / four fingers (right hand): the key</text><rect x="110" y="754" width="16" height="14" rx="3" fill="#d8483c" fill-opacity="0.45" stroke="#d8483c"/><text x="136" y="766" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the base of the thumb or palm: soft, pushes against the body</text><rect x="110" y="778" width="16" height="14" rx="3" fill="#8a857a" fill-opacity="0.45" stroke="#8a857a"/><text x="136" y="790" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">four fingers round the edge (left hand)</text><rect x="110" y="802" width="16" height="14" rx="3" fill="#3f9a52" fill-opacity="0.45" stroke="#3f9a52"/><text x="136" y="814" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">a fingertip or thumb tip that can reach</text><text x="1180" y="150" font-size="17" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">WHERE THE WHEEL CAN GO</text><circle cx="1192" cy="185" r="12" fill="#2b7a3d" stroke="#fff" stroke-width="1.5" /><text x="1192" y="190" font-size="14" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="middle">A</text><text x="1216" y="186" font-size="14" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">top-right corner (chamfer)</text><text x="1216" y="206" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">left hand: the index tip curls onto it; right hand: the thumb</text><text x="1216" y="222" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">tip sweeps it from above. Both reach it. The rim sticks out</text><text x="1216" y="238" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">about 1 mm.</text><circle cx="1192" cy="277" r="12" fill="#9a7a1e" stroke="#fff" stroke-width="1.5" /><text x="1192" y="282" font-size="14" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="middle">B</text><text x="1216" y="278" font-size="14" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">right edge, upper middle</text><text x="1216" y="298" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the four fingers sit here (left hand). You would have to lift</text><text x="1216" y="314" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">one finger: poor.</text><circle cx="1192" cy="369" r="12" fill="#9a2f1a" stroke="#fff" stroke-width="1.5" /><text x="1192" y="374" font-size="14" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="middle">C</text><text x="1216" y="370" font-size="14" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">right edge, lower</text><text x="1216" y="390" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the small finger and palm: poor. Also the first place a bag</text><text x="1216" y="406" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">pushes on.</text><circle cx="1192" cy="461" r="12" fill="#9a2f1a" stroke="#fff" stroke-width="1.5" /><text x="1192" y="466" font-size="14" fill="#fff" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="middle">D</text><text x="1216" y="462" font-size="14" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">lower left (the old place)</text><text x="1216" y="482" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the base of the thumb. The owner found it hard to reach:</text><text x="1216" y="498" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">confirmed. Rejected.</text><text x="1180" y="580" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Also true: mode changes are rare, so the free hand may turn the wheel. Then</text><text x="1180" y="596" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">every position works, and the choice is only about not being touched by</text><text x="1180" y="612" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">accident, which a corner and stiff detents help with.</text><text x="1180" y="650" font-size="14" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">HOW FAR MAY THINGS STICK OUT? (top view of the left edge)</text><g transform="translate(1220,700) scale(9)"><rect x="0" y="0" width="22" height="18" rx="1.2" fill="#e8e1cf" stroke="#6f6a5e" stroke-width="0.2" /><polygon points="0,3 -6.5,3 -6.5,15 0,15" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.2" /></g><g transform="translate(1560,700) scale(9)"><rect x="0" y="0" width="22" height="18" rx="3" fill="#e8e1cf" stroke="#6f6a5e" stroke-width="0.2" /><path d="M0,3.2 Q-4.6,3.2 -4.6,6.6 L-4.6,11.4 Q-4.6,14.8 0,14.8 Z" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.2" /></g><text x="1190" y="890" font-size="12" fill="#9a2f1a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">digs in: 6.5 mm out, square corners</text><text x="1530" y="890" font-size="12" fill="#2f6f3a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">rule of thumb: 5 mm at most,</text><text x="1530" y="906" font-size="12" fill="#2f6f3a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">corner radius 2 mm or more, sloped</text><text x="60" y="1010" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">These limits are my starting numbers from comfort reasoning, not from a study. They are cheap to test: print the body with a key block at 3, 5 and 7 mm and hold each for a few minutes.</text></svg>