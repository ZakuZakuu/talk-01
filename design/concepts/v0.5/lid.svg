<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1070" width="1920" height="1070"><defs></defs><rect width="1920" height="1070" fill="#f4f1ea"/><text x="60" y="62" font-size="28" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">talk.01 · v0.5 study · THE LID WITHOUT SCREWS, AND WHAT SITS INSIDE</text><text x="60" y="92" font-size="15" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">a battery-cover style lid: two hooks tuck in at the top, two snap arms click in at the bottom, a thumb notch lifts it</text><text x="1860" y="52" font-size="13" fill="#e8541e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">TENTATIVE · NOT ENGINEERED · NOTHING PRINTED</text><text x="60" y="140" font-size="16" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">THE LID, FROM THE FRONT</text><g transform="translate(110,190) scale(5.2)"><path d="M0,0 H58 V51 Q58,56 53,56 H5 Q0,56 0,51 Z" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.4"/><rect x="8" y="-2.2" width="9" height="2.4" rx="0.5" fill="#b4ab95" stroke="#3d382d" stroke-width="0.3" /><rect x="41" y="-2.2" width="9" height="2.4" rx="0.5" fill="#b4ab95" stroke="#3d382d" stroke-width="0.3" /><rect x="3.6" y="30" width="1" height="22" rx="0.4" fill="#15130f" stroke="none" stroke-width="0" /><rect x="2.4" y="30" width="1.2" height="22" rx="0.4" fill="#a49c88" stroke="#3d382d" stroke-width="0.2" /><polygon points="1.8,32 1.8,32 1,34" fill="none" stroke="none" stroke-width="0" /><polygon points="2.4,31 1.5,33 2.4,35" fill="#ee6a2c" stroke="#8a2f0e" stroke-width="0.2" /><rect x="53.3" y="30" width="1" height="22" rx="0.4" fill="#15130f" stroke="none" stroke-width="0" /><rect x="54.4" y="30" width="1.2" height="22" rx="0.4" fill="#a49c88" stroke="#3d382d" stroke-width="0.2" /><polygon points="56.2,32 56.2,32 57,34" fill="none" stroke="none" stroke-width="0" /><polygon points="55.6,31 56.5,33 55.6,35" fill="#ee6a2c" stroke="#8a2f0e" stroke-width="0.2" /><path d="M25.0,56 a4,4 0 0 1 8,0" fill="#15130f" stroke="none" stroke-width="0" /></g><text x="430" y="184.8" font-size="11.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">two rigid hook tabs (they do not flex)</text><text x="430" y="398" font-size="11.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">two snap arms: they bend in the plane of the lid</text><text x="430" y="413" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">bumps (orange) click into recesses in the body wall</text><text x="430" y="484" font-size="11.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">thumb notch: put a nail in and lift</text><text x="60" y="520" font-size="16" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">HOW IT GOES ON (side view): tab under the lip, swing down, press until it clicks</text><g transform="translate(90,545) scale(5.0)"><g transform="translate(0,0)"><rect x="0" y="0" width="3" height="24" rx="0.5" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="0" y="0" width="8" height="2.4" rx="0.5" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><g transform="translate(4.2,3.4) rotate(-28)"><rect x="0" y="0" width="2.4" height="22" rx="0.4" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.25" /><rect x="-1.6" y="-0.8" width="2" height="1.8" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.2" /></g><rect x="0" y="24" width="8" height="1.8" rx="0.4" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /></g><g transform="translate(36,0)"><rect x="0" y="0" width="3" height="24" rx="0.5" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="0" y="0" width="8" height="2.4" rx="0.5" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><g transform="translate(4.2,3.4) rotate(-10)"><rect x="0" y="0" width="2.4" height="22" rx="0.4" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.25" /><rect x="-1.6" y="-0.8" width="2" height="1.8" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.2" /></g><rect x="0" y="24" width="8" height="1.8" rx="0.4" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /></g><g transform="translate(72,0)"><rect x="0" y="0" width="3" height="24" rx="0.5" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="0" y="0" width="8" height="2.4" rx="0.5" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><g transform="translate(4.2,3.4) rotate(0)"><rect x="0" y="0" width="2.4" height="22" rx="0.4" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.25" /><rect x="-1.6" y="-0.8" width="2" height="1.8" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.2" /></g><rect x="0" y="24" width="8" height="1.8" rx="0.4" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /></g></g><text x="110" y="700" font-size="12" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">1 · tabs in</text><text x="290" y="700" font-size="12" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">2 · swing down</text><text x="470" y="700" font-size="12" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">3 · click</text><text x="60" y="740" font-size="11.5" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Why the snap arms bend in the plane (an FDM reason):</text><text x="60" y="758" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· a printed part is weakest between layers. If the lid lies flat while printing, an arm that bends</text><text x="60" y="773" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  up and down would stress the layers. An arm that bends sideways (in the plane) bends along its</text><text x="60" y="788" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  layers.</text><text x="60" y="806" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· so the hooks are rigid and only the two side arms flex, in plane.</text><text x="60" y="824" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start"></text><text x="60" y="842" font-size="11.5" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">A first size, from the beam formula (a hand calculation, not a test):</text><text x="60" y="860" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· strain at the root = 1.5 x t x y / L^2, with t = 1.2 mm thick, L = 12 mm free length, y = 0.8 mm</text><text x="60" y="875" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  deflection → 1.5 x 1.2 x 0.8 / 144 = 1.0 %.</text><text x="60" y="893" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· published guidance (informal sources, not checked) gives roughly 8 % elongation at break for PLA</text><text x="60" y="908" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  and 24 % for PETG, and says to design to only 10 to 15 % of that: about 1 % for PLA (marginal)</text><text x="60" y="923" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  and 2 to 4 % for PETG (comfortable). So print the lid in PETG, fillet the arm root, and test a</text><text x="60" y="938" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  coupon first.</text><text x="60" y="956" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· a gap of 0.2 to 0.3 mm round the lid is a usual starting clearance on FDM; to be tuned on the</text><text x="60" y="971" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  owner's printer.</text><text x="1130" y="130" font-size="16" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">WHAT SITS INSIDE (side section, front at the left)</text><g transform="translate(1150,150) scale(7.6)"><rect x="0" y="0" width="22" height="92" rx="3" fill="#f0ece0" stroke="#3d382d" stroke-width="0.4" /><rect x="0" y="0" width="1.8" height="36" rx="0.3" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="0" y="36" width="2.4" height="56" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.25" /><rect x="-0.7" y="37.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="40.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="43.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="46.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="49.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="52.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="55.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="58.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="61.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="64.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="67.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="70.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="73.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="76.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="79.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="82.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="85.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="-0.7" y="88.2" width="0.8" height="1.9" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.1" /><rect x="2.4" y="36.6" width="0.6" height="55" rx="0.2" fill="#bdb6a2" stroke="none" stroke-width="0" /><rect x="3" y="36" width="1.6" height="56" rx="0.3" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="2.9" y="45" width="1.8" height="38" rx="0" fill="#15130f" stroke="none" stroke-width="0" /><rect x="20.4" y="0" width="1.6" height="92" rx="0.3" fill="#e4dcc8" stroke="#3d382d" stroke-width="0.25" /><rect x="13.8" y="4" width="6.6" height="21" rx="0.4" fill="#2f6b52" stroke="#173d2e" stroke-width="0.25" /><rect x="8" y="-0.4" width="5" height="3.4" rx="0.6" fill="#cfcfcf" stroke="#2b2a28" stroke-width="0.2" /><rect x="4.6" y="62" width="2.2" height="14" rx="0.3" fill="#2f6b52" stroke="#173d2e" stroke-width="0.25" /><rect x="6.8" y="66.5" width="1.2" height="3.6" rx="0.3" fill="#222" stroke="#000" stroke-width="0.15" /><rect x="0.6" y="3.8" width="5.4" height="13.4" rx="0.8" fill="#3e3b35" stroke="#000" stroke-width="0.3" /><rect x="6" y="6.6" width="6.8" height="7.8" rx="0.6" fill="#8a857a" stroke="#444" stroke-width="0.25" /><rect stroke-dasharray="1 0.8" x="7.4" y="30" width="11.6" height="24" rx="0.8" fill="none" stroke="#8a857a" stroke-width="0.3" /><rect x="20.4" y="8" width="1.6" height="22" rx="0.3" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.25" /><rect x="17.4" y="12" width="3" height="14" rx="0.3" fill="#222" stroke="#000" stroke-width="0.2" /><rect x="20.4" y="52" width="5.5" height="38" rx="1" fill="#cdc3aa" stroke="#3d382d" stroke-width="0.3" /></g><line x1="1233.6" y1="256.4" x2="1352.4" y2="195.6" stroke="#8a857a" stroke-width="0.8" /><circle cx="1233.6" cy="256.4" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1358.4" y="199.6" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">dev board, about 21 mm</text><line x1="1229.8" y1="180.4" x2="1352.4" y2="150" stroke="#8a857a" stroke-width="0.8" /><circle cx="1229.8" cy="180.4" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1358.4" y="154" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">USB-C on top</text><line x1="1175.84" y1="226" x2="1352.4" y2="271.6" stroke="#8a857a" stroke-width="0.8" /><circle cx="1175.84" cy="226" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1358.4" y="275.6" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">wheel 5.4 mm + encoder ~7 mm</text><line x1="1248.8" y1="469.2" x2="1352.4" y2="423.6" stroke="#8a857a" stroke-width="0.8" /><circle cx="1248.8" cy="469.2" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1358.4" y="427.6" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">space kept for a battery later</text><line x1="1159.12" y1="682" x2="1352.4" y2="606" stroke="#8a857a" stroke-width="0.8" /><circle cx="1159.12" cy="682" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1358.4" y="610" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">lid 2.4 mm: ridges + base</text><line x1="1206.24" y1="666.8" x2="1352.4" y2="682" stroke="#8a857a" stroke-width="0.8" /><circle cx="1206.24" cy="666.8" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1358.4" y="686" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">MEMS mic board behind the hole</text><line x1="1309.6" y1="286.8" x2="1352.4" y2="332.4" stroke="#8a857a" stroke-width="0.8" /><circle cx="1309.6" cy="286.8" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1358.4" y="336.4" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">back hatch with pins</text><line x1="1324.8" y1="682" x2="1352.4" y2="773.2" stroke="#8a857a" stroke-width="0.8" /><circle cx="1324.8" cy="682" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1358.4" y="777.2" font-size="11" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">small U stand</text><text x="1130" y="880" font-size="11.5" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">A depth budget (22 mm, tentative):</text><text x="1130" y="895" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· front wall 1.8 to 3 + back wall 1.6 leaves about 17 mm</text><text x="1130" y="910" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  inside;</text><text x="1130" y="925" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· wheel (5.4) + encoder (~7) + a little air fits in about 13</text><text x="1130" y="940" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  mm;</text><text x="1130" y="955" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· a dev board with headers is about 8 to 9 mm thick, so it</text><text x="1130" y="970" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  fits behind the controls zone;</text><text x="1130" y="985" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">· part sizes are typical values; check each datasheet (the</text><text x="1130" y="1000" font-size="11.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">  EC11 drawing, the board you buy).</text></svg>