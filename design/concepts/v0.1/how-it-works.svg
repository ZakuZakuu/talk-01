<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1050" width="1920" height="1050"><defs><linearGradient id="v1" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#e9e2d1"/><stop offset="0.55" stop-color="#e8e1cf"/><stop offset="1" stop-color="#dad3c2"/></linearGradient><linearGradient id="v2" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#efeadb"/><stop offset="0.55" stop-color="#efe9d9"/><stop offset="1" stop-color="#e0dbcb"/></linearGradient><linearGradient id="bk1" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#e9e2d1"/><stop offset="0.55" stop-color="#e8e1cf"/><stop offset="1" stop-color="#dad3c2"/></linearGradient><linearGradient id="v1" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#e9e2d1"/><stop offset="0.55" stop-color="#e8e1cf"/><stop offset="1" stop-color="#dad3c2"/></linearGradient><linearGradient id="v2" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#efeadb"/><stop offset="0.55" stop-color="#efe9d9"/><stop offset="1" stop-color="#e0dbcb"/></linearGradient></defs><rect width="1920" height="1050" fill="#f4f1ea"/><text x="60" y="62" font-size="30" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">talk.01 · v0.1 · HOW IT WORKS (kept simple)</text><text x="60" y="92" font-size="15" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">a front section: the thumb wheel on the left, the board at the top, the one big key on the right</text><text x="1860" y="52" font-size="13" fill="#e8541e" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">TENTATIVE · NOT ENGINEERED</text><g transform="translate(900,130) scale(7.0)"><rect x="0" y="0" width="58" height="92" rx="5" fill="#e0dac8" stroke="#6f6a5e" stroke-width="0.45" /><rect x="18" y="4" width="22" height="18" rx="1.2" fill="#2f6b52" stroke="#173d2e" stroke-width="0.3" /><rect x="24.5" y="2.4" width="9" height="3.8" rx="0.8" fill="#cfcfcf" stroke="#2b2a28" stroke-width="0.2" /><rect x="9" y="56" width="10" height="8" rx="1" fill="#444" stroke="#222" stroke-width="0.3" /><circle cx="5" cy="68" r="9.8" fill="#1f5a5f" stroke="#000" stroke-width="0.4" /><circle cx="5" cy="68" r="8" fill="#2f7f85" stroke="#000" stroke-width="0.4" /><circle cx="5" cy="68" r="1.6" fill="#cfcfcf" stroke="#444" stroke-width="0.3" /><line x1="5" y1="61.4" x2="5" y2="60" stroke="#bfe3e6" stroke-width="0.4" /><line x1="6.37" y1="61.54" x2="6.66" y2="60.17" stroke="#bfe3e6" stroke-width="0.4" /><line x1="7.68" y1="61.97" x2="8.25" y2="60.69" stroke="#bfe3e6" stroke-width="0.4" /><line x1="8.88" y1="62.66" x2="9.7" y2="61.53" stroke="#bfe3e6" stroke-width="0.4" /><line x1="9.9" y1="63.58" x2="10.95" y2="62.65" stroke="#bfe3e6" stroke-width="0.4" /><line x1="10.72" y1="64.7" x2="11.93" y2="64" stroke="#bfe3e6" stroke-width="0.4" /><line x1="11.28" y1="65.96" x2="12.61" y2="65.53" stroke="#bfe3e6" stroke-width="0.4" /><line x1="11.56" y1="67.31" x2="12.96" y2="67.16" stroke="#bfe3e6" stroke-width="0.4" /><line x1="11.56" y1="68.69" x2="12.96" y2="68.84" stroke="#bfe3e6" stroke-width="0.4" /><line x1="11.28" y1="70.04" x2="12.61" y2="70.47" stroke="#bfe3e6" stroke-width="0.4" /><line x1="10.72" y1="71.3" x2="11.93" y2="72" stroke="#bfe3e6" stroke-width="0.4" /><line x1="9.9" y1="72.42" x2="10.95" y2="73.35" stroke="#bfe3e6" stroke-width="0.4" /><line x1="8.88" y1="73.34" x2="9.7" y2="74.47" stroke="#bfe3e6" stroke-width="0.4" /><line x1="7.68" y1="74.03" x2="8.25" y2="75.31" stroke="#bfe3e6" stroke-width="0.4" /><line x1="6.37" y1="74.46" x2="6.66" y2="75.83" stroke="#bfe3e6" stroke-width="0.4" /><line x1="5" y1="74.6" x2="5" y2="76" stroke="#bfe3e6" stroke-width="0.4" /><line x1="3.63" y1="74.46" x2="3.34" y2="75.83" stroke="#bfe3e6" stroke-width="0.4" /><line x1="2.32" y1="74.03" x2="1.75" y2="75.31" stroke="#bfe3e6" stroke-width="0.4" /><line x1="1.12" y1="73.34" x2="0.3" y2="74.47" stroke="#bfe3e6" stroke-width="0.4" /><line x1="0.1" y1="72.42" x2="-0.95" y2="73.35" stroke="#bfe3e6" stroke-width="0.4" /><line x1="-0.72" y1="71.3" x2="-1.93" y2="72" stroke="#bfe3e6" stroke-width="0.4" /><line x1="-1.28" y1="70.04" x2="-2.61" y2="70.47" stroke="#bfe3e6" stroke-width="0.4" /><line x1="-1.56" y1="68.69" x2="-2.96" y2="68.84" stroke="#bfe3e6" stroke-width="0.4" /><line x1="-1.56" y1="67.31" x2="-2.96" y2="67.16" stroke="#bfe3e6" stroke-width="0.4" /><line x1="-1.28" y1="65.96" x2="-2.61" y2="65.53" stroke="#bfe3e6" stroke-width="0.4" /><line x1="-0.72" y1="64.7" x2="-1.93" y2="64" stroke="#bfe3e6" stroke-width="0.4" /><line x1="0.1" y1="63.58" x2="-0.95" y2="62.65" stroke="#bfe3e6" stroke-width="0.4" /><line x1="1.12" y1="62.66" x2="0.3" y2="61.53" stroke="#bfe3e6" stroke-width="0.4" /><line x1="2.32" y1="61.97" x2="1.75" y2="60.69" stroke="#bfe3e6" stroke-width="0.4" /><line x1="3.63" y1="61.54" x2="3.34" y2="60.17" stroke="#bfe3e6" stroke-width="0.4" /><rect x="9.4" y="64" width="3" height="8" rx="0.8" fill="#b8b19c" stroke="#555" stroke-width="0.2" /><polygon stroke-dasharray="1.2 0.8" points="58,14 58,87 54,87 54,14" fill="none" stroke="#8a857a" stroke-width="0.3" /><polygon points="58,14 64.4,19 61.6,85 58,87" fill="#3d9aa1" stroke="#1f5a5f" stroke-width="0.55" stroke-linejoin="round"/><polyline points="50,36 51.06,37 52.12,35 53.18,37 54.24,35 55.3,37 56.36,35 57.42,37 58.48,35 59.54,37 60.6,36" fill="none" stroke="#5a5750" stroke-width="0.3"/><rect x="46" y="33" width="6" height="6" rx="1" fill="#555" stroke="#222" stroke-width="0.3" /><rect x="50.4" y="50" width="3.4" height="4" rx="0.5" fill="#111" stroke="#000" stroke-width="0.2" /><rect x="50.4" y="64" width="3.4" height="4" rx="0.5" fill="#111" stroke="#000" stroke-width="0.2" /><rect x="50.6" y="22" width="3" height="3.4" rx="0.5" fill="#2b2a28" stroke="#000" stroke-width="0.2" /><rect x="59.4" y="21.4" width="1.6" height="3.2" rx="0.4" fill="#e9873a" stroke="#6b2509" stroke-width="0.2" /><circle cx="58" cy="87" r="1.7" fill="#c9a24b" stroke="#4d3d12" stroke-width="0.3" /></g><line x1="1103" y1="221" x2="853" y2="186" stroke="#8a857a" stroke-width="0.8" /><circle cx="1103" cy="221" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="847" y="190" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">dev board with USB-C on top</text><line x1="935" y1="606" x2="853" y2="592" stroke="#8a857a" stroke-width="0.8" /><circle cx="935" cy="606" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="847" y="596" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">THUMB WHEEL: a ribbed disc, a pin through its centre</text><line x1="977" y1="606" x2="853" y2="662" stroke="#8a857a" stroke-width="0.8" /><circle cx="977" cy="606" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="847" y="666" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">spring-ball click: four detents</text><line x1="977" y1="550" x2="853" y2="508" stroke="#8a857a" stroke-width="0.8" /><circle cx="977" cy="550" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="847" y="512" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="end">small encoder reads the position</text><line x1="1317.2" y1="340" x2="1402" y2="312" stroke="#8a857a" stroke-width="0.8" /><circle cx="1317.2" cy="340" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1408" y="316" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">BIG KEY: hinged at the bottom,</text><line x1="1292" y1="382" x2="1402" y2="410" stroke="#8a857a" stroke-width="0.8" /><circle cx="1292" cy="382" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1408" y="414" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">a spring holds it out (slanted)</text><line x1="1264" y1="494" x2="1402" y2="522" stroke="#8a857a" stroke-width="0.8" /><circle cx="1264" cy="494" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1408" y="526" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">switch 1: HOLD (talk while held)</text><line x1="1264" y1="592" x2="1402" y2="620" stroke="#8a857a" stroke-width="0.8" /><circle cx="1264" cy="592" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1408" y="624" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">switch 2: CLICK at the bottom (latch)</text><line x1="1264" y1="291" x2="1402" y2="228" stroke="#8a857a" stroke-width="0.8" /><circle cx="1264" cy="291" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1408" y="232" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Hall sensor + magnet (optional)</text><line x1="1306" y1="739" x2="1402" y2="746" stroke="#8a857a" stroke-width="0.8" /><circle cx="1306" cy="739" r="3" fill="#8a857a" stroke="none" stroke-width="0" /><text x="1408" y="750" font-size="12.5" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">steel hinge pin</text><text x="60" y="150" font-size="18" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">THE WHEEL</text><text x="60" y="172" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">its axis is perpendicular to the face:</text><text x="60" y="188" font-size="12" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">from the front it is a circle.</text><g transform="translate(60,205) scale(6)"><circle cx="14" cy="14" r="10" fill="#2f7f85" stroke="#000" stroke-width="0.5" /><circle cx="19" cy="9" r="10" fill="#256a70" stroke="#000" stroke-width="0.5" /><line x1="4.6" y1="8.4" x2="9.6" y2="3.4" stroke="#000" stroke-width="0.4" /><line x1="23.4" y1="20.6" x2="28.4" y2="15.6" stroke="#000" stroke-width="0.4" /><path d="M14,14 L9,19" fill="none" stroke="#c9461e" stroke-width="0.8" /><polygon points="8.2,19.8 11.4,19.2 9.2,16.8" fill="#c9461e" stroke="#c9461e" stroke-width="0.05" /><line x1="14" y1="6" x2="14" y2="4" stroke="#bfe3e6" stroke-width="0.4" /><line x1="15.66" y1="6.17" x2="16.08" y2="4.22" stroke="#bfe3e6" stroke-width="0.4" /><line x1="17.25" y1="6.69" x2="18.07" y2="4.86" stroke="#bfe3e6" stroke-width="0.4" /><line x1="18.7" y1="7.53" x2="19.88" y2="5.91" stroke="#bfe3e6" stroke-width="0.4" /><line x1="19.95" y1="8.65" x2="21.43" y2="7.31" stroke="#bfe3e6" stroke-width="0.4" /><line x1="20.93" y1="10" x2="22.66" y2="9" stroke="#bfe3e6" stroke-width="0.4" /><line x1="21.61" y1="11.53" x2="23.51" y2="10.91" stroke="#bfe3e6" stroke-width="0.4" /><line x1="21.96" y1="13.16" x2="23.95" y2="12.95" stroke="#bfe3e6" stroke-width="0.4" /><line x1="21.96" y1="14.84" x2="23.95" y2="15.05" stroke="#bfe3e6" stroke-width="0.4" /><line x1="21.61" y1="16.47" x2="23.51" y2="17.09" stroke="#bfe3e6" stroke-width="0.4" /><line x1="20.93" y1="18" x2="22.66" y2="19" stroke="#bfe3e6" stroke-width="0.4" /><line x1="19.95" y1="19.35" x2="21.43" y2="20.69" stroke="#bfe3e6" stroke-width="0.4" /><line x1="18.7" y1="20.47" x2="19.88" y2="22.09" stroke="#bfe3e6" stroke-width="0.4" /><line x1="17.25" y1="21.31" x2="18.07" y2="23.14" stroke="#bfe3e6" stroke-width="0.4" /><line x1="15.66" y1="21.83" x2="16.08" y2="23.78" stroke="#bfe3e6" stroke-width="0.4" /><line x1="14" y1="22" x2="14" y2="24" stroke="#bfe3e6" stroke-width="0.4" /><line x1="12.34" y1="21.83" x2="11.92" y2="23.78" stroke="#bfe3e6" stroke-width="0.4" /><line x1="10.75" y1="21.31" x2="9.93" y2="23.14" stroke="#bfe3e6" stroke-width="0.4" /><line x1="9.3" y1="20.47" x2="8.12" y2="22.09" stroke="#bfe3e6" stroke-width="0.4" /><line x1="8.05" y1="19.35" x2="6.57" y2="20.69" stroke="#bfe3e6" stroke-width="0.4" /><line x1="7.07" y1="18" x2="5.34" y2="19" stroke="#bfe3e6" stroke-width="0.4" /><line x1="6.39" y1="16.47" x2="4.49" y2="17.09" stroke="#bfe3e6" stroke-width="0.4" /><line x1="6.04" y1="14.84" x2="4.05" y2="15.05" stroke="#bfe3e6" stroke-width="0.4" /><line x1="6.04" y1="13.16" x2="4.05" y2="12.95" stroke="#bfe3e6" stroke-width="0.4" /><line x1="6.39" y1="11.53" x2="4.49" y2="10.91" stroke="#bfe3e6" stroke-width="0.4" /><line x1="7.07" y1="10" x2="5.34" y2="9" stroke="#bfe3e6" stroke-width="0.4" /><line x1="8.05" y1="8.65" x2="6.57" y2="7.31" stroke="#bfe3e6" stroke-width="0.4" /><line x1="9.3" y1="7.53" x2="8.12" y2="5.91" stroke="#bfe3e6" stroke-width="0.4" /><line x1="10.75" y1="6.69" x2="9.93" y2="4.86" stroke="#bfe3e6" stroke-width="0.4" /><line x1="12.34" y1="6.17" x2="11.92" y2="4.22" stroke="#bfe3e6" stroke-width="0.4" /><circle cx="14" cy="14" r="1.4" fill="#cfcfcf" stroke="#444" stroke-width="0.3" /></g><text x="60" y="360" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the thumb strokes the rim up and</text><text x="60" y="376" font-size="12" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">down along the left edge.</text><text x="60" y="400" font-size="12" fill="#9a2f1a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">(My earlier roller drawing was a ribbed</text><text x="60" y="416" font-size="12" fill="#9a2f1a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">bar, which reads as a sideways axis.</text><text x="60" y="432" font-size="12" fill="#9a2f1a" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">That was a drawing error; fixed.)</text><text x="60" y="840" font-size="18" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif" text-anchor="start">THE KEY'S STAGES (the TE lever's idea)</text><text x="60" y="870" font-size="13" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">rest</text><text x="330" y="870" font-size="13" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">the spring holds the key out</text><text x="640" y="870" font-size="13" fill="#2f6f3a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">READY</text><text x="60" y="894" font-size="13" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">press to mid-travel</text><text x="330" y="894" font-size="13" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">switch 1 closes</text><text x="640" y="894" font-size="13" fill="#2f6f3a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">TALK: key held while pressed</text><text x="60" y="918" font-size="13" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">press to the bottom</text><text x="330" y="918" font-size="13" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">switch 2 closes (a click)</text><text x="640" y="918" font-size="13" fill="#2f6f3a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">LATCH: hands-free</text><text x="60" y="942" font-size="13" fill="#2b2a28" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">firm push past the click</text><text x="330" y="942" font-size="13" fill="#2b2a28" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Hall sensor (optional)</text><text x="640" y="942" font-size="13" fill="#2f6f3a" font-weight="bold" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">SEND</text><text x="60" y="990" font-size="12.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">v0.1 can start with ONE stage (switch 1) and add the rest later: the parts are ordinary micro-switches.</text><text x="60" y="1008" font-size="12.5" fill="#7a756b" font-weight="normal" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" text-anchor="start">Bag safety without a sleeve: the key sits between two raised shoulders, and the wheel's LOCK position makes the firmware ignore it.</text></svg>