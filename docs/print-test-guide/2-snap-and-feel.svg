<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1490" width="1400" height="1490"><rect width="1400" height="1490" fill="#f4f0e6"/><text x="50" y="58" font-size="34" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">卡扣盖板和手感试件怎么试</text><text x="50" y="90" font-size="16" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">snap_lid.stl + snap_frame.stl，以及机身、按键块、滚轮 · 大意到了就行</text><text x="50" y="140" font-size="22" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">A  卡扣盖板：先认识它</text><rect x="70" y="190" width="345" height="276" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2.5" /><rect x="290.8" y="171.6" width="75.9" height="18.4" rx="0" fill="#b6a98c" stroke="#2b2a28" stroke-width="2" /><rect x="118.3" y="171.6" width="75.9" height="18.4" rx="0" fill="#b6a98c" stroke="#2b2a28" stroke-width="2" /><rect x="389.7" y="305" width="11.5" height="166.75" rx="0" fill="#2b2a28" stroke="none" stroke-width="1" /><rect x="401.2" y="305" width="13.8" height="161" rx="0" fill="#c7b999" stroke="#2b2a28" stroke-width="1.5" /><rect x="415" y="420" width="9.2" height="36.8" rx="0" fill="#d9531e" stroke="#2b2a28" stroke-width="1.5" /><rect x="83.8" y="305" width="11.5" height="166.75" rx="0" fill="#2b2a28" stroke="none" stroke-width="1" /><rect x="70" y="305" width="13.8" height="161" rx="0" fill="#c7b999" stroke="#2b2a28" stroke-width="1.5" /><rect x="60.8" y="420" width="9.2" height="36.8" rx="0" fill="#d9531e" stroke="#2b2a28" stroke-width="1.5" /><path d="M208,466 a34.5,34.5 0 0 1 69,0 Z" fill="#f4f0e6" stroke="#2b2a28" stroke-width="2"/><line x1="328.75" y1="171.6" x2="612" y2="145" stroke="#8a857a" stroke-width="1.5" /><circle cx="328.75" cy="171.6" r="4" fill="#8a857a" stroke="none" stroke-width="1"/><text x="620" y="150" font-size="16" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">钩子 ×2：硬的，不会弯，</text><text x="620" y="172" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">用来钩进框架上边的唇下面</text><line x1="408.1" y1="374" x2="612" y2="235" stroke="#8a857a" stroke-width="1.5" /><circle cx="408.1" cy="374" r="4" fill="#8a857a" stroke="none" stroke-width="1"/><text x="620" y="240" font-size="16" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">卡臂 ×2：细长的，会向里弯，</text><text x="620" y="262" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">尾巴上的橙色凸点会「咔哒」卡进框架侧槽</text><line x1="242.5" y1="454" x2="612" y2="325" stroke="#8a857a" stroke-width="1.5" /><circle cx="242.5" cy="454" r="4" fill="#8a857a" stroke="none" stroke-width="1"/><text x="620" y="330" font-size="16" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">拇指缺口：用指甲抠这里把盖板撬起来</text><text x="50" y="544" font-size="22" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">怎么装上去（侧面看，上边是盖板的「钩子」那一头）</text><rect x="70" y="580" width="24" height="190" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><rect x="70" y="580" width="90" height="22" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><rect x="70" y="748" width="70" height="22" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><polygon points="118,616 132.13,608.49 202.55,740.93 188.42,748.44" fill="#c7b999" stroke="#2b2a28" stroke-width="2"/><rect x="96" y="612" width="26" height="12" rx="0" fill="#b6a98c" stroke="#2b2a28" stroke-width="2" /><line x1="210" y1="710" x2="172.83" y2="672.83" stroke="#d9531e" stroke-width="3" /><polygon points="170,670 178.5,672.96 172.96,678.5" fill="#d9531e"/><text x="90" y="810" font-size="18" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">① 斜着，钩子</text><text x="90" y="834" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">先插进框架的唇下面</text><rect x="490" y="580" width="24" height="190" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><rect x="490" y="580" width="90" height="22" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><rect x="490" y="748" width="70" height="22" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><polygon points="538,616 553.65,612.67 584.84,759.4 569.19,762.72" fill="#c7b999" stroke="#2b2a28" stroke-width="2"/><rect x="516" y="612" width="26" height="12" rx="0" fill="#b6a98c" stroke="#2b2a28" stroke-width="2" /><line x1="630" y1="720" x2="593.88" y2="710.97" stroke="#d9531e" stroke-width="3" /><polygon points="590,710 598.81,708.17 596.91,715.76" fill="#d9531e"/><text x="510" y="810" font-size="18" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">② 慢慢放平</text><text x="510" y="834" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">钩子留在唇下面</text><rect x="910" y="580" width="24" height="190" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><rect x="910" y="580" width="90" height="22" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><rect x="910" y="748" width="70" height="22" rx="0" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2" /><polygon points="958,616 974,616 974,766 958,766" fill="#c7b999" stroke="#2b2a28" stroke-width="2"/><rect x="936" y="612" width="26" height="12" rx="0" fill="#b6a98c" stroke="#2b2a28" stroke-width="2" /><line x1="1060" y1="710" x2="1004" y2="710" stroke="#d9531e" stroke-width="3" /><polygon points="1000,710 1008.1,706.09 1008.1,713.91" fill="#d9531e"/><text x="1060" y="680" font-size="18" fill="#d9531e" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">咔哒</text><text x="930" y="810" font-size="18" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">③ 压盖板的下边</text><text x="930" y="834" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">听到「咔哒」= 卡上了</text><text x="70" y="870" font-size="17" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">怎么取下来：指甲伸进拇指缺口 → 先把下边撬起来 → 再把钩子从唇下斜着抽出来。</text><text x="50" y="910" font-size="22" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">怎么判断（三种情况）</text><rect x="56" y="930" width="390" height="110" rx="8" fill="#fffaf0" stroke="#b53a22" stroke-width="2.5" /><text x="70" y="962" font-size="20" fill="#b53a22" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">太紧</text><text x="70" y="988" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">要用很大的力才压得下，</text><text x="70" y="1008" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">卡臂弯得很厉害，</text><text x="70" y="1028" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">或者听到「啪」一声断了。</text><rect x="476" y="930" width="390" height="110" rx="8" fill="#fffaf0" stroke="#2f7a46" stroke-width="2.5" /><text x="490" y="962" font-size="20" fill="#2f7a46" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">刚好</text><text x="490" y="988" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">轻按就有清楚的「咔哒」，</text><text x="490" y="1008" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">装好后不晃，</text><text x="490" y="1028" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">倒过来轻抖也不会掉。</text><rect x="896" y="930" width="390" height="110" rx="8" fill="#fffaf0" stroke="#2f6f9f" stroke-width="2.5" /><text x="910" y="962" font-size="20" fill="#2f6f9f" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">太松</text><text x="910" y="988" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">没有咔哒声，</text><text x="910" y="1008" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">装好后会晃，</text><text x="910" y="1028" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">倒过来一抖就掉下来。</text><text x="70" y="1070" font-size="16" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">再做两件事：①装上、取下，重复 5 次 → 臂有没有裂？  ②装好后在桌上轻轻敲一敲 → 松不松？</text><text x="70" y="1096" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">PLA 比较脆，臂断了也是有用的信息，不算打坏。把断口拍给我看就行。</text><text x="50" y="1150" font-size="22" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">B  手感试件：四件小事</text><circle cx="72" cy="1185" r="20" fill="#d9531e" stroke="#fff" stroke-width="2"/><text x="72" y="1193" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">握</text><text x="110" y="1186" font-size="16" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">左手握住机身，拿 1 分钟。</text><text x="110" y="1210" font-size="16" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">太厚？太宽？还是刚好？</text><circle cx="72" cy="1247" r="20" fill="#d9531e" stroke="#fff" stroke-width="2"/><text x="72" y="1255" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">键</text><text x="110" y="1248" font-size="16" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">把 3 / 5 / 7 mm 的按键块用双面胶贴在左边缘的浅凹槽里，</text><text x="110" y="1272" font-size="16" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">分别用拇指按一按。哪个不硌手、够得着？</text><circle cx="72" cy="1309" r="20" fill="#d9531e" stroke="#fff" stroke-width="2"/><text x="72" y="1317" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">轮</text><text x="110" y="1310" font-size="16" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">滚轮放进右上角圆凹槽，插一根 1.75 mm 耗材当轴，</text><text x="110" y="1334" font-size="16" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">用食指或拇指拨轮缘。凸出的 1.2 mm 够不够拨？</text><circle cx="72" cy="1371" r="20" fill="#d9531e" stroke="#fff" stroke-width="2"/><text x="72" y="1379" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">纹</text><text x="110" y="1372" font-size="16" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">手指在下半部横脊上划过去。</text><text x="110" y="1396" font-size="16" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">舒服？扎手？会不会太滑？</text><text x="70" y="1450" font-size="16" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">拍几张照片发给我就好：校准板正面、卡扣盖板装好的样子、三个按键块贴在机身上的样子（带尺子更好）。</text></svg>