" stroke="#2b2a28" stroke-width="1.5"/><circle cx="678" cy="227.2" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="678" cy="227.2" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><text x="510" y="146" font-size="17" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">② 向上推</text><text x="510" y="439.6" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">蘑菇钉滑进窄槽</text><text x="510" y="461.6" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">顶边顶住控制区</text><text x="510" y="483.6" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">「咔哒」一声卡到位</text><path d="M960.0,160.0 V382.6 Q960.0,403.6 981.0,403.6 H1140.6 Q1161.6,403.6 1161.6,382.6 V160.0 Z" fill="#e8e1cf" stroke="#6f6a5e" stroke-width="2.5"/><rect x="960" y="160" width="201.6" height="25.2" rx="0" fill="#bdb6a2" stroke="none" stroke-width="1" /><text x="1060.8" y="176.8" font-size="15" fill="#2b2a28" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">控制区</text><circle cx="1060.8" cy="298.6" r="71.4" fill="#faf6ea" stroke="#8a857a" stroke-width="2"/><rect x="987.72" y="357.4" width="11.76" height="25.2" rx="0" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5" /><circle cx="993.6" cy="357.4" r="5.88" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><circle cx="993.6" cy="382.6" r="13.02" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><rect x="1122.12" y="357.4" width="11.76" height="25.2" rx="0" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5" /><circle cx="1128" cy="357.4" r="5.88" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><circle cx="1128" cy="382.6" r="13.02" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><rect x="987.72" y="214.6" width="11.76" height="25.2" rx="0" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5" /><circle cx="993.6" cy="214.6" r="5.88" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><circle cx="993.6" cy="239.8" r="13.02" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><rect x="1122.12" y="214.6" width="11.76" height="25.2" rx="0" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5" /><circle cx="1128" cy="214.6" r="5.88" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><circle cx="1128" cy="239.8" r="13.02" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><rect x="960.42" y="185.83" width="200.76" height="217.35" rx="8" fill="#c7b999" stroke="#d9531e" stroke-width="3" fill-opacity="0.55"/><circle cx="993.6" cy="357.4" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="993.6" cy="357.4" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><circle cx="1128" cy="357.4" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="1128" cy="357.4" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><circle cx="993.6" cy="214.6" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="993.6" cy="214.6" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><circle cx="1128" cy="214.6" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="1128" cy="214.6" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><text x="960" y="146" font-size="17" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">③ 卡好</text><text x="960" y="439.6" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">外轮廓和机身一样大</text><text x="960" y="461.6" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">正面只有一块平面</text><text x="960" y="483.6" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">蘑菇头比窄槽宽，提不起来</text><line x1="291.6" y1="410" x2="476" y2="410" stroke="#d9531e" stroke-width="4" /><polygon points="480,410 471.9,413.91 471.9,406.09" fill="#d9531e"/><line x1="741.6" y1="410" x2="926" y2="410" stroke="#d9531e" stroke-width="4" /><polygon points="930,410 921.9,413.91 921.9,406.09" fill="#d9531e"/><text x="293.6" y="395" font-size="14" fill="#d9531e" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">向上推</text><text x="743.6" y="395" font-size="14" fill="#d9531e" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">向上推</text><rect x="50" y="525.6" width="1300" height="74" rx="8" fill="#fffaf0" stroke="#b9ad8a" stroke-width="2" /><text x="70" y="553.6" font-size="18" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">取下来：</text><text x="160" y="553.6" font-size="16" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">拇指压着横脊，把盖板往下推 6 mm（要用点力，越过「咔哒」），然后垂直提起。横脊本来就是防滑的把手。</text><text x="160" y="581.6" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">要不要更好抓？下边缘可以做一个很小的缺口露出盖板边缘（在机身上，不在盖板上），以后再说。</text><text x="50" y="663.6" font-size="20" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">侧面剖开看一个蘑菇钉（放大）</text><rect x="120" y="723.6" width="273" height="62.4" rx="0" fill="#c7b999" stroke="#2b2a28" stroke-width="2" /><rect x="120" y="786" width="109.2" height="41.6" rx="0" fill="#d8cfb4" stroke="#2b2a28" stroke-width="2" /><rect x="294.2" y="786" width="98.8" height="41.6" rx="0" fill="#d8cfb4" stroke="#2b2a28" stroke-width="2" /><rect x="230.5" y="786" width="62.4" height="49.4" rx="0" fill="#b6a98c" stroke="#2b2a28" stroke-width="2" /><polygon points="230.50000000000006,835.4 292.90000000000003,835.4 326.70000000000005,877.0 196.70000000000005,877.0" fill="#b6a98c" stroke="#2b2a28" stroke-width="2"/><rect x="196.7" y="877" width="130" height="13" rx="0" fill="#b6a98c" stroke="#2b2a28" stroke-width="2" /><line x1="403" y1="749.6" x2="427" y2="749.6" stroke="#8a857a" stroke-width="1.5" /><text x="433" y="754.6" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">盖板 2.4 mm（正面朝上，横脊在最上面）</text><line x1="403" y1="806.8" x2="427" y2="806.8" stroke="#8a857a" stroke-width="1.5" /><text x="433" y="811.8" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">地板 1.6 mm，中间是窄槽（宽 2.8）</text><line x1="403" y1="825" x2="427" y2="825" stroke="#8a857a" stroke-width="1.5" /><text x="433" y="830" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">颈 Ø2.4：在槽里滑动</text><line x1="403" y1="879.6" x2="427" y2="879.6" stroke="#8a857a" stroke-width="1.5" /><text x="433" y="884.6" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">蘑菇头 Ø5.0：比槽宽，盖板就提不起来</text><text x="50" y="967.2" font-size="20" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">「咔哒」是怎么来的（地板里的小弹舌，俯视）</text><rect x="120" y="1007.2" width="360" height="54.6" rx="0" fill="#d8cfb4" stroke="#2b2a28" stroke-width="2" /><rect x="180" y="1007.2" width="250" height="65" rx="0" fill="#faf6ea" stroke="#2b2a28" stroke-width="1.5" /><rect x="200" y="1007.2" width="210" height="39" rx="0" fill="#d8cfb4" stroke="#2b2a28" stroke-width="2" /><circle cx="214" cy="1007.2" r="6" fill="#8a857a" stroke="none" stroke-width="1"/><text x="520" y="997.2" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">地板上切出一条细细的平舌（14 × 3 mm），舌尖有一个小凸点（0.6 mm）。</text><text x="520" y="1023.2" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">盖板背面对应位置有一条浅槽。盖板滑到位时，凸点弹进槽里，就是「咔哒」。</text><text x="520" y="1049.2" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">舌是平躺着弯的，顺着打印层的方向受力，比竖着的卡臂结实（这是 FDM 的经验，没有测试过）。</text><text x="520" y="1075.2" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">想取下时，推力要越过凸点，估计要 2~3 N（手算，PLA，没有测过）。</text></svg>