<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1157.2" width="1400" height="1157.2"><rect width="1400" height="1157.2" fill="#f4f0e6"/><text x="50" y="58" font-size="34" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">卡扣盖板：锁孔滑动式</text><text x="50" y="90" font-size="16" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">盖板正面是完整的一块平面，卡扣全部藏在背面 · 示意图（比例大致准确）</text><path d="M60.0,160.0 V382.6 Q60.0,403.6 81.0,403.6 H240.6 Q261.6,403.6 261.6,382.6 V160.0 Z" fill="#e8e1cf" stroke="#6f6a5e" stroke-width="2.5"/><rect x="60" y="160" width="201.6" height="25.2" rx="0" fill="#bdb6a2" stroke="none" stroke-width="1" /><text x="160.8" y="176.8" font-size="15" fill="#2b2a28" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">控制区</text><circle cx="160.8" cy="298.6" r="71.4" fill="#faf6ea" stroke="#8a857a" stroke-width="2"/><rect x="87.72" y="357.4" width="11.76" height="25.2" rx="0" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5" /><circle cx="93.6" cy="357.4" r="5.88" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><circle cx="93.6" cy="382.6" r="13.02" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><rect x="222.12" y="357.4" width="11.76" height="25.2" rx="0" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5" /><circle cx="228" cy="357.4" r="5.88" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><circle cx="228" cy="382.6" r="13.02" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><rect x="87.72" y="214.6" width="11.76" height="25.2" rx="0" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5" /><circle cx="93.6" cy="214.6" r="5.88" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><circle cx="93.6" cy="239.8" r="13.02" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><rect x="222.12" y="214.6" width="11.76" height="25.2" rx="0" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5" /><circle cx="228" cy="214.6" r="5.88" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><circle cx="228" cy="239.8" r="13.02" fill="#faf6ea" stroke="#8a857a" stroke-width="1.5"/><rect x="60.42" y="211.03" width="200.76" height="217.35" rx="8" fill="#c7b999" stroke="#d9531e" stroke-width="3" fill-opacity="0.55"/><circle cx="93.6" cy="382.6" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="93.6" cy="382.6" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><circle cx="228" cy="382.6" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="228" cy="382.6" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><circle cx="93.6" cy="239.8" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="93.6" cy="239.8" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><circle cx="228" cy="239.8" r="5.04" fill="#2b2a28" stroke="none" stroke-width="1"/><circle cx="228" cy="239.8" r="10.5" fill="none" stroke="#2b2a28" stroke-width="1.5"/><text x="60" y="146" font-size="17" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">① 放上去</text><text x="60" y="464.8" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">盖板比正位低 6 mm</text><text x="60" y="486.8" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">（下边悬在机身外）</text><text x="60" y="508.8" font-size="15" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">四个蘑菇钉对准圆孔，垂直放下</text><path d="M510.0,160.0 V382.6 Q510.0,403.6 531.0,403.6 H690.6 Q711.6,403.6 711.6,382.6 V160.0 Z" fill="#e8e1cf" stroke="#6f6a5e" stroke-width="2.5"/><rect x="510" y="160" width="201.6" height="25.2" rx="0" fill="#bdb6a2" stroke="none" stroke-width="1" /><text x="610.8" y="176.8" font-size="15" fill="#