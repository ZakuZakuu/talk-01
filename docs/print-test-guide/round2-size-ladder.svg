<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1107.1999999999998" width="1400" height="1107.1999999999998"><rect width="1400" height="1107.1999999999998" fill="#f4f0e6"/><text x="50" y="58" font-size="34" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">第二轮：尺寸梯度</text><text x="50" y="90" font-size="16" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">你觉得「太厚、太宽」，所以做三个更小的机身一起比一比（宽 × 高 × 厚，单位 mm）</text><text x="70" y="136" font-size="18" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">正面（左上角对齐）</text><polygon points="70.0,150.0 310.8,150.0 394.8,234.0 394.8,665.2 70.0,665.2" fill="none" stroke="#8a857a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6"/><rect x="424.8" y="170" width="16" height="16" rx="0" fill="#8a857a" stroke="none" stroke-width="1" /><text x="448.8" y="183" font-size="15" fill="#8a857a" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">S0   58 × 92 × 24   （第一轮（已打印））</text><polygon points="70.0,150.0 277.2,150.0 361.2,234.0 361.2,654.0 70.0,654.0" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" /><rect x="424.8" y="200" width="16" height="16" rx="0" fill="#2f6f9f" stroke="none" stroke-width="1" /><text x="448.8" y="213" font-size="15" fill="#2f6f9f" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">S1   52 × 90 × 20   （小一步）</text><polygon points="70.0,150.0 254.8,150.0 338.8,234.0 338.8,642.8 70.0,642.8" fill="none" stroke="#d9531e" stroke-width="3" stroke-linejoin="round" /><rect x="424.8" y="230" width="16" height="16" rx="0" fill="#d9531e" stroke="none" stroke-width="1" /><text x="448.8" y="243" font-size="15" fill="#d9531e" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">S2   48 × 88 × 17   （明显变薄变窄）</text><polygon points="70.0,150.0 243.6,150.0 327.6,234.0 327.6,631.6 70.0,631.6" fill="none" stroke="#2f7a46" stroke-width="3" stroke-linejoin="round" /><rect x="424.8" y="260" width="16" height="16" rx="0" fill="#2f7a46" stroke="none" stroke-width="1" /><text x="448.8" y="273" font-size="15" fill="#2f7a46" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">S3   46 × 86 × 15   （很薄（只用来体验））</text><text x="780" y="136" font-size="18" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">侧面（后面对齐；厚度 = 右边）</text><rect x="780" y="150" width="134.4" height="515.2" rx="4" fill="none" stroke="#8a857a" stroke-width="3" stroke-dasharray="8 6"/><rect x="780" y="150" width="112" height="504" rx="4" fill="none" stroke="#2f6f9f" stroke-width="3" /><rect x="780" y="150" width="95.2" height="492.8" rx="4" fill="none" stroke="#d9531e" stroke-width="3" /><rect x="780" y="150" width="84" height="481.6" rx="4" fill="none" stroke="#2f7a46" stroke-width="3" /><text x="780" y="693.2" font-size="14" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">越往右越厚：S0 24 → S1 20 → S2 17 → S3 15 mm</text><text x="50" y="755.2" font-size="20" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">纸面上能不能装得下电子件？（按现有零件的典型尺寸算，没有量过真实零件）</text><rect x="50" y="771.2" width="14" height="14" rx="0" fill="#8a857a" stroke="none" stroke-width="1" /><text x="76" y="783.2" font-size="17" fill="#8a857a" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">S0 58×92×24</text><text x="300" y="783.2" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">能装，板子可以放在滚轮零件后面，余量约 3.6 mm。</text><text x="300" y="805.2" font-size="14" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">你说太厚、太宽、够不着滚轮。</text><rect x="50" y="835.2" width="14" height="14" rx="0" fill="#2f6f9f" stroke="none" stroke-width="1" /><text x="76" y="847.2" font-size="17" fill="#2f6f9f" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">S1 52×90×20</text><text x="300" y="847.2" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">勉强：板子放在滚轮零件后面会超出约 0.4 mm，要么用更矮的开关，要么把板子挪到旁边。</text><text x="300" y="869.2" font-size="14" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">小一步。</text><rect x="50" y="899.2" width="14" height="14" rx="0" fill="#d9531e" stroke="none" stroke-width="1" /><text x="76" y="911.2" font-size="17" fill="#d9531e" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">S2 48×88×17</text><text x="300" y="911.2" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">可以，但要把主控板放在滚轮的左边（不是后面），USB 接口靠左；开关要选矮一点的（约 3 mm）。余量约 2~3 mm。</text><text x="300" y="933.2" font-size="14" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">我倾向这个。</text><rect x="50" y="963.2" width="14" height="14" rx="0" fill="#2f7a46" stroke="none" stroke-width="1" /><text x="76" y="975.2" font-size="17" fill="#2f7a46" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">S3 46×86×15</text><text x="300" y="975.2" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">装不下：宽度放不下主控板，厚度只剩约 0.2 mm 余量。</text><text x="300" y="997.2" font-size="14" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">只用来体验「很薄」是什么手感。</text><text x="50" y="1067.2" font-size="15" fill="#2b2a28" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">按键块：每个机身配一个 5 mm 的（深度随机身变），你上一轮没告诉我 3/5/7 哪个最舒服——这次请一起告诉我。</text></svg>