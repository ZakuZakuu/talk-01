<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1270" width="1400" height="1270"><rect width="1400" height="1270" fill="#f4f0e6"/><text x="50" y="58" font-size="34" fill="#2b2a28" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">校准板怎么试</text><text x="50" y="90" font-size="16" fill="#6b675c" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">calibration_plate.stl + calibration_tabs.stl · 看个大概就行，不用量得很准</text><rect x="60" y="140" width="880" height="560" rx="6" fill="#d8cfb4" stroke="#6f6a5e" stroke-width="2.5" /><rect x="114.8" y="242.8" width="82.4" height="82.4" rx="0" fill="#8d856f" stroke="#2b2a28" stroke-width="1.5" /><circle cx="124" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><rect x="226.4" y="242.4" width="83.2" height="83.2" rx="0" fill="#8d856f" stroke="#2b2a28" stroke-width="1.5" /><circle cx="236" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><circle cx="253.6" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><rect x="338" y="242" width="84" height="84" rx="0" fill="#8d856f" stroke="#2b2a28" stroke-width="1.5" /><circle cx="348" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><circle cx="365.6" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><circle cx="383.2" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><rect x="449.6" y="241.6" width="84.8" height="84.8" rx="0" fill="#8d856f" stroke="#2b2a28" stroke-width="1.5" /><circle cx="460" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><circle cx="477.6" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><circle cx="495.2" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><circle cx="512.8" cy="352" r="3.2" fill="#6f6a5e" stroke="none" stroke-width="1"/><rect x="560.8" y="240.8" width="86.4" height="86.4" rx="0" fill="#8d856f" stroke="#2b2a28" stroke-width